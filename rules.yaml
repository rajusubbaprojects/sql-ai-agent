# ── Business Definitions ───────────────────────────────
definitions:
  - name: "Delayed Flight"
    rule: "Flights where delay > 0 (delay is stored in minutes)"

  - name: "On-time Flight"
    rule: "Flights where delay = 0 or delay IS NULL"

  - name: "Short Flight"
    rule: "Flights where flight_length < 60 minutes"

  - name: "Long Flight"
    rule: "Flights where flight_length >= 180 minutes"

  - name: "Airport Code"
    rule: "3-letter IATA codes stored in airport_from and airport_to"

# ── Query Rules ────────────────────────────────────────
query_rules:
  - "Always use LIMIT 1000 unless user specifies a different limit"
  - "Never use SELECT * — always specify column names"
  - "Always add ORDER BY when returning ranked results"
  - "Use table aliases for readability in JOINs"
  - "Always filter soft-deleted records where deleted_at IS NULL"

# ── Naming Conventions ─────────────────────────────────
naming:
  - "Primary keys are always named 'id'"
  - "Foreign keys follow pattern: tablename_id (e.g. airline_id)"
  - "Timestamps are stored in UTC"
  - "Boolean fields use 0/1 integers"

# ── Performance Rules ──────────────────────────────────
performance:
  - "Always use indexed columns in WHERE clauses"
  - "Avoid functions on indexed columns in WHERE (breaks index)"
  - "Use EXPLAIN for queries on tables with 100k+ rows"
