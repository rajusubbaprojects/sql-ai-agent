# business_rules.yaml
# These rules are injected into Claude's prompt to guide SQL generation.
# Edit this file to match your domain knowledge — no code changes needed.

version: "1.0"
database: airlines_db
description: "Airlines flight data — operational rules for SQL generation"

# ── Domain Vocabulary ──────────────────────────────────────────────────
# Teach Claude what domain terms mean in terms of actual columns/values
vocabulary:
  - term: "delayed flight"
    definition: "A flight where delay > 15 (minutes)"
    sql_hint: "WHERE delay > 15"

  - term: "on-time flight"
    definition: "A flight where delay <= 15"
    sql_hint: "WHERE delay <= 15"

  - term: "cancelled flight"
    definition: "A flight where delay = -1"
    sql_hint: "WHERE delay = -1"

  - term: "long flight"
    definition: "A flight where flight_length > 200 minutes"
    sql_hint: "WHERE flight_length > 200"

  - term: "short flight"
    definition: "A flight where flight_length <= 90 minutes"
    sql_hint: "WHERE flight_length <= 90"

# ── Column Explanations ────────────────────────────────────────────────
# Clarify columns whose names aren't self-explanatory
column_rules:
  - column: "day_of_week"
    explanation: "Integer 1–7 where 1=Monday, 2=Tuesday, ..., 7=Sunday"
    example: "To filter Mondays: WHERE day_of_week = 1"

  - column: "delay"
    explanation: "Delay in minutes. Negative values mean early arrival. -1 means cancelled."
    example: "Delayed flights: WHERE delay > 15"

  - column: "flight_time_integer"
    explanation: "Scheduled departure time as integer (e.g. 900 = 9:00 AM, 1430 = 2:30 PM)"
    example: "Morning flights: WHERE flight_time_integer BETWEEN 600 AND 1159"

  - column: "flight_length"
    explanation: "Total flight duration in minutes"
    example: "Flights over 3 hours: WHERE flight_length > 180"

  - column: "airport_from"
    explanation: "3-letter IATA departure airport code"
    example: "ATL=Atlanta, ORD=Chicago, LAX=Los Angeles"

  - column: "airport_to"
    explanation: "3-letter IATA arrival airport code"
    example: "JFK=New York, SFO=San Francisco, PHX=Phoenix"

# ── Query Rules ────────────────────────────────────────────────────────
# Hard rules Claude must always follow when generating SQL
query_rules:
  - rule: "Always exclude cancelled flights (delay = -1) unless the user specifically asks about cancellations"
    priority: high

  - rule: "When counting delayed flights, use delay > 15 as the threshold"
    priority: high

  - rule: "Always use LIMIT 100 on SELECT queries unless the user asks for all records or an aggregate"
    priority: medium

  - rule: "Use table alias 'a' for the airlines table (e.g. FROM airlines a)"
    priority: low

  - rule: "When the user mentions a day by name (e.g. Monday), convert it to the correct day_of_week integer"
    priority: high

  - rule: "flight_time_integer is NOT a time type — do not use TIME functions on it"
    priority: high

# ── Output Format Rules ────────────────────────────────────────────────
# Rules about how Claude should format its response
output_rules:
  - rule: "Always return the raw SQL query first, then the explanation"
  - rule: "Label the SQL block clearly with 'SQL:' prefix"
  - rule: "Explain what the query does in plain English after the SQL"
  - rule: "If the question is ambiguous, state your assumption before the SQL"

# ── Safety Rules ───────────────────────────────────────────────────────
# Protect the database from dangerous queries
safety_rules:
  - rule: "Never generate DROP, TRUNCATE, or ALTER statements"
  - rule: "Never generate INSERT, UPDATE, or DELETE statements unless explicitly told this is allowed"
  - rule: "If a question is not related to the database, politely decline and explain why"