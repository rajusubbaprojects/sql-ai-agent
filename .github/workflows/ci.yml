name: CI
on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: airlines_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create and seed database
        run: |
          mysql -h 127.0.0.1 -u root airlines_db < backend/migrations/init.sql
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
      - name: Debug Claude API connection
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # pragma: allowlist secret
        run: |
          python3 -c "
          import anthropic, os
          key = os.getenv(chr(39)+'ANTHROPIC_API_KEY'+chr(39), chr(39)+chr(39))
          print(f'Key length: {len(key)}')
          try:
              client = anthropic.Anthropic(api_key=key)
              response = client.messages.create(
                  model=chr(39)+'claude-sonnet-4-5'+chr(39),
                  max_tokens=50,
                  messages=[{chr(39)+'role'+chr(39): chr(39)+'user'+chr(39), chr(39)+'content'+chr(39): chr(39)+'Say OK'+chr(39)}]
              )
              print(chr(39)+'Claude API: OK -'+chr(39), response.content[0].text)
          except Exception as e:
              print(f'Claude API ERROR: {type(e).__name__}: {e}')
          "
      - name: Run Phase 2 tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # pragma: allowlist secret
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: airlines_db
          DB_USER: root
          DB_PASSWORD: ""
          APP_ENV: test
          DEBUG: "true"
          RULES_FILE: rules.yaml
        run: |
          pytest tests/test_phase2.py -v --tb=short

  docker-build:
    name: Docker Build & Validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t sql-ai-agent:ci .
      - name: Validate image exists
        run: docker images sql-ai-agent:ci
      - name: Validate docker-compose config
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password # pragma: allowlist secret
          MYSQL_DATABASE: airlines_db
          MYSQL_USER: ci-user
          MYSQL_PASSWORD: ci-password # pragma: allowlist secret
        run: docker compose config

  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # pragma: allowlist secret
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # pragma: allowlist secret
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push AMD64 image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sql-ai-agent
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64             -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG             -t $ECR_REGISTRY/$ECR_REPOSITORY:latest             --push .
      - name: Deploy to ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sql-ai-agent
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs update-service             --cluster sql-ai-agent-cluster             --service sql-ai-agent-service             --force-new-deployment             --region us-east-1
      - name: Wait for deployment
        run: |
          aws ecs wait services-stable             --cluster sql-ai-agent-cluster             --services sql-ai-agent-service             --region us-east-1
      - name: Verify deployment
        run: |
          aws ecs describe-services             --cluster sql-ai-agent-cluster             --services sql-ai-agent-service             --query "services[0].{Running:runningCount,Desired:desiredCount}"             --output table             --region us-east-1
      - name: Smoke test via ALB
        run: |
         sleep 30
         curl -f http://${{ secrets.ALB_DNS }}/health
