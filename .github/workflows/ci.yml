name: CI
on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: airlines_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create and seed database
        run: |
          mysql -h 127.0.0.1 -u root airlines_db < backend/migrations/init.sql
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
      - name: Debug Claude API connection
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # pragma: allowlist secret
        run: |
          python3 -c "
          import anthropic, os
          key = os.getenv(chr(39)+'ANTHROPIC_API_KEY'+chr(39), chr(39)+chr(39))
          print(f'Key length: {len(key)}')
          try:
              client = anthropic.Anthropic(api_key=key)
              response = client.messages.create(
                  model=chr(39)+'claude-sonnet-4-5'+chr(39),
                  max_tokens=50,
                  messages=[{chr(39)+'role'+chr(39): chr(39)+'user'+chr(39), chr(39)+'content'+chr(39): chr(39)+'Say OK'+chr(39)}]
              )
              print(chr(39)+'Claude API: OK -'+chr(39), response.content[0].text)
          except Exception as e:
              print(f'Claude API ERROR: {type(e).__name__}: {e}')
          "
      - name: Run Phase 2 tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # pragma: allowlist secret
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: airlines_db
          DB_USER: root
          DB_PASSWORD: ""
          APP_ENV: test
          DEBUG: "true"
          RULES_FILE: rules.yaml
        run: |
          pytest tests/test_phase2.py -v --tb=short

  docker-build:
    name: Docker Build & Validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t sql-ai-agent:ci .
      - name: Validate image exists
        run: docker images sql-ai-agent:ci
      - name: Validate docker-compose config
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password # pragma: allowlist secret
          MYSQL_DATABASE: airlines_db
          MYSQL_USER: ci-user
          MYSQL_PASSWORD: ci-password # pragma: allowlist secret
        run: docker compose config

  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # pragma: allowlist secret
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # pragma: allowlist secret
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push AMD64 image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sql-ai-agent
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64             -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG             -t $ECR_REGISTRY/$ECR_REPOSITORY:latest             --push .
      - name: Deploy to ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sql-ai-agent
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Get exact image URI with digest
          DIGEST=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$IMAGE_TAG \
            --query "imageDetails[0].imageDigest" \
            --output text)

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST"
          echo "Deploying image: $IMAGE_URI"

          # Fetch current task definition and update image
          aws ecs describe-task-definition \
            --task-definition sql-ai-agent-task \
            --query "taskDefinition" \
            --output json > /tmp/task.json

          python3 - "$IMAGE_URI" << 'PYEOF'
          import json, sys
          image_uri = sys.argv[1]
          with open('/tmp/task.json') as f:
              td = json.load(f)
          td['containerDefinitions'][0]['image'] = image_uri
          for field in ['taskDefinitionArn','revision','status','requiresAttributes',
                        'compatibilities','registeredAt','registeredBy']:
              td.pop(field, None)
          with open('/tmp/new_task.json', 'w') as f:
              json.dump(td, f)
          print(f"Image set to: {image_uri}")
          PYEOF

          # Register new task definition revision
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new_task.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "New task definition: $NEW_ARN"

          # Update service
          aws ecs update-service \
            --cluster sql-ai-agent-cluster \
            --service sql-ai-agent-service \
            --task-definition $NEW_ARN \
            --region us-east-1 \
            --query "service.deployments[0].status" \
            --output text
      - name: Wait for deployment
        run: |
          echo "Waiting for ECS service to stabilize (up to 30 min)..."
          for i in $(seq 1 60); do
            STATUS=$(aws ecs describe-services \
              --cluster sql-ai-agent-cluster \
              --services sql-ai-agent-service \
              --region us-east-1 \
              --query 'services[0].{deps:length(deployments),run:runningCount,des:desiredCount}' \
              --output json)
            DEPS=$(echo "$STATUS" | jq -r '.deps')
            RUNNING=$(echo "$STATUS" | jq -r '.run')
            DESIRED=$(echo "$STATUS" | jq -r '.des')
            echo "Attempt $i/60: deployments=$DEPS running=$RUNNING desired=$DESIRED"
            if [ "$DEPS" = "1" ] && [ "$RUNNING" = "$DESIRED" ] && [ "$DESIRED" != "0" ]; then
              echo "Service is stable"
              exit 0
            fi
            sleep 30
          done
          echo "=== ECS service events (last 5) ==="
          aws ecs describe-services \
            --cluster sql-ai-agent-cluster \
            --services sql-ai-agent-service \
            --region us-east-1 \
            --query 'services[0].events[:5]' \
            --output table
          echo "Service did not stabilize in 30 minutes"
          exit 1
      - name: Verify deployment
        run: |
          aws ecs describe-services             --cluster sql-ai-agent-cluster             --services sql-ai-agent-service             --query "services[0].{Running:runningCount,Desired:desiredCount}"             --output table             --region us-east-1
      - name: Smoke test via ALB
        run: |
          sleep 30
          echo "Running smoke test against ALB..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              http://${{ secrets.ALB_DNS }}/health)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 3 minutes"
          exit 1

  deploy-frontend:
    name: Deploy frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Inject API key into index.html
        run: |
          sed -i "s|__FRONTEND_API_KEY__|${{ secrets.FRONTEND_API_KEY }}|g" frontend/index.html

      - name: Upload to S3
        run: |
          aws s3 cp frontend/index.html \
            s3://${{ secrets.S3_BUCKET }}/index.html \
            --content-type "text/html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
